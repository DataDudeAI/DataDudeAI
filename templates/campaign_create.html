<!DOCTYPE html>
<html>
<head>
    <title>Campaign Management - DataDude</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-link"></i>
            <span>DataDude Campaign Manager</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="/analytics" class="nav-link"><i class="fas fa-chart-line"></i> Analytics</a>
        </div>
    </nav>

    <div class="container">
        <!-- Campaign Creation Form -->
        <div class="campaign-form-section">
            <h2><i class="fas fa-plus-circle"></i> Create New Campaign</h2>
            <form id="campaign-form" class="form-grid">
                <div class="form-group">
                    <label>Campaign Name *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Original URL *</label>
                    <input type="url" name="url" required>
                </div>
                <div class="form-group">
                    <label>Campaign Type</label>
                    <select name="type" required>
                        <option value="social">Social Media</option>
                        <option value="email">Email</option>
                        <option value="ads">Paid Ads</option>
                        <option value="organic">Organic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>UTM Source</label>
                    <input type="text" name="utm_source">
                </div>
                <div class="form-group">
                    <label>UTM Medium</label>
                    <input type="text" name="utm_medium">
                </div>
                <div class="form-group">
                    <label>UTM Campaign</label>
                    <input type="text" name="utm_campaign">
                </div>
                <button type="submit" class="btn-primary">Create Campaign</button>
            </form>
        </div>

        <!-- Campaign Management Table -->
        <div class="campaigns-table-section">
            <h2><i class="fas fa-tasks"></i> Campaign Management</h2>
            <div class="table-container">
                <table id="campaigns-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Short URL</th>
                            <th>Type</th>
                            <th>Clicks</th>
                            <th>Unique Visitors</th>
                            <th>Created</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="campaigns-body">
                        <!-- Campaigns will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Campaign Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Campaign</h2>
            <form id="edit-form">
                <input type="hidden" name="campaign_id">
                <div class="form-group">
                    <label>Campaign Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Original URL</label>
                    <input type="url" name="url" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="active">Active</option>
                        <option value="paused">Paused</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Update Campaign</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/campaign.js') }}"></script>
</body>
</html>
