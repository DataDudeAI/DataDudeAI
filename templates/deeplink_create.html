<!DOCTYPE html>
<html>
<head>
    <title>Create Deep Link - DataDude</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-link"></i>
            <span>DataDude Links</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <a href="/analytics" class="nav-link"><i class="fas fa-chart-bar"></i> Analytics</a>
        </div>
    </nav>

    <div class="container">
        <div class="create-link-section">
            <h1><i class="fas fa-magic"></i> Create Smart Link</h1>
            <p class="subtitle">Create powerful deep links with advanced tracking capabilities</p>

            <form id="deeplink-form" class="deeplink-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label><i class="fas fa-link"></i> Target URL (Required)</label>
                        <input type="url" name="target_url" required placeholder="https://your-app-or-website.com">
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-globe"></i> Fallback URL</label>
                        <input type="url" name="fallback_url" placeholder="https://fallback-website.com">
                    </div>

                    <div class="form-group">
                        <label><i class="fab fa-android"></i> Android Package</label>
                        <input type="text" name="android_package" placeholder="com.example.app">
                    </div>

                    <div class="form-group">
                        <label><i class="fab fa-apple"></i> iOS Bundle ID</label>
                        <input type="text" name="ios_bundle" placeholder="com.example.app">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-code-branch"></i> Minimum Version</label>
                        <input type="text" name="minimum_version" placeholder="1.0.0">
                    </div>

                    <div class="form-group full-width">
                        <label><i class="fas fa-tags"></i> Custom Data (JSON)</label>
                        <textarea name="custom_data" placeholder='{"campaign": "summer_2024", "source": "email"}'></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-magic"></i> Create Link
                    </button>
                </div>
            </form>
            
            <div id="result" class="result-box" style="display: none;">
                <div class="success-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h3>Your Smart Link is Ready!</h3>
                <div class="link-display">
                    <a id="deep-link" target="_blank"></a>
                    <button id="copy-link" class="btn-secondary">
                        <i class="fas fa-copy"></i> Copy Link
                    </button>
                </div>
                <div class="qr-code" id="qr-code"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="{{ url_for('static', filename='js/deeplink.js') }}"></script>
</body>
</html>
